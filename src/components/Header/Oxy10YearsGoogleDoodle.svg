<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 44" width="250" height="44" className="oxy-doodle-svg" aria-label="10 Years of OxyLoans Anniversary Doodle">
  <defs>
    <!-- 3D Gold Gradient for '10' -->
    <linearGradient id="doodleGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- 3D Gold Shadow -->
    <linearGradient id="doodleGoldShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="doodleHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Character Shirt Gradient -->
    <linearGradient id="doodleShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Drop Shadow Filter for Doodle -->
    <filter id="doodleSoftShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#doodleSoftShadow)">
    <!-- ========================================================
         1. CONFETTI PIECES (Background Layer)
         ======================================================== -->
    <g className="doodle-confetti-group">
      <!-- Confetti 1: Cyan ribbon top-left -->
      <path d="M 6 12 C 4 9 7 6 10 7 C 12 8 10 11 8 13" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
      <!-- Confetti 2: Pink triangle -->
      <polygon points="18,5 23,8 19,11" fill="#ec4899" />
      <!-- Confetti 3: Emerald circle -->
      <circle cx="44" cy="7" r="2.2" fill="#10b981" />
      <!-- Confetti 4: Gold diamond near 10 -->
      <polygon points="56,4 59,7 56,10 53,7" fill="#f59e0b" />
      <!-- Confetti 5: Blue circle top -->
      <circle cx="98" cy="6" r="2" fill="#3b82f6" />
      <!-- Confetti 6: Purple diamond above text -->
      <polygon points="152,3 155,6 152,9 149,6" fill="#a855f7" />
      <!-- Confetti 7: Red square -->
      <rect x="188" y="4" width="4" height="4" rx="0.8" fill="#ef4444" transform="rotate(15 190 6)" />
      <!-- Confetti 8: Cyan streamer far-right -->
      <path d="M 238 9 C 242 11 240 15 244 17" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" />
      <!-- Confetti 9: Gold star right -->
      <polygon points="234,26 236,30 240,30 237,33 238,37 234,34 230,37 231,33 228,30 232,30" fill="#f59e0b" transform="scale(0.65) translate(120 -5)" />
      <!-- Confetti 10: Green dot bottom -->
      <circle cx="95" cy="40" r="2.2" fill="#10b981" />
      <!-- Confetti 11: Yellow dot bottom right -->
      <circle cx="168" cy="41" r="2" fill="#facc15" />
    </g>

    <!-- ========================================================
         2. CARTOON CHARACTER (Waving Boy with Party Hat)
         ======================================================== -->
    <g className="doodle-character-group" transform="translate(4, 2)">
      <!-- Left Hand (Resting) -->
      <circle cx="8" cy="35" r="3.2" fill="#fed7aa" stroke="#ea580c" stroke-width="0.6" />

      <!-- Body / Blue Shirt -->
      <path d="M 10 32 L 26 32 C 28 32 30 35 30 40 L 6 40 C 6 35 8 32 10 32 Z" fill="url(#doodleShirt)" />
      <!-- White Collar -->
      <polygon points="14,32 18,36 22,32 20,32 18,34 16,32" fill="#ffffff" />
      <line x1="18" y1="36" x2="18" y2="40" stroke="#1e3a8a" stroke-width="1.2" stroke-linecap="round" />

      <!-- Waving Right Arm & Hand -->
      <g className="doodle-waving-arm">
        <path d="M 24 33 Q 32 28 35 21" fill="none" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round" />
        <circle cx="35" cy="20" r="3.4" fill="#fed7aa" stroke="#ea580c" stroke-width="0.6" />
        <!-- Fingers -->
        <circle cx="36" cy="18" r="1.2" fill="#fed7aa" />
        <circle cx="38" cy="20" r="1.1" fill="#fed7aa" />
      </g>

      <!-- Head Base -->
      <rect x="9" y="16" width="18" height="18" rx="7" fill="#fed7aa" stroke="#ea580c" stroke-width="0.7" />
      <!-- Left Ear -->
      <circle cx="9" cy="25" r="2.5" fill="#fed7aa" stroke="#ea580c" stroke-width="0.6" />
      <!-- Right Ear -->
      <circle cx="27" cy="25" r="2.5" fill="#fed7aa" stroke="#ea580c" stroke-width="0.6" />

      <!-- Stylish Hair -->
      <path d="M 8 20 C 8 13 15 12 18 12 C 23 12 28 14 28 20 C 27 17 24 16 21 16 C 18 16 16 18 14 17 C 12 16 9 18 8 20 Z" fill="#451a03" />

      <!-- Happy Cartoon Eyes -->
      <ellipse cx="14" cy="23" rx="1.6" ry="2" fill="#1e293b" />
      <circle cx="14.6" cy="22.2" r="0.6" fill="#ffffff" />

      <ellipse cx="22" cy="23" rx="1.6" ry="2" fill="#1e293b" />
      <circle cx="22.6" cy="22.2" r="0.6" fill="#ffffff" />

      <!-- Rosy Cheeks -->
      <circle cx="12" cy="26" r="1.8" fill="#fb7185" opacity="0.45" />
      <circle cx="24" cy="26" r="1.8" fill="#fb7185" opacity="0.45" />

      <!-- Cheerful Smile -->
      <path d="M 15.5 26.5 Q 18 30 20.5 26.5" fill="#b91c1c" stroke="#b91c1c" stroke-width="0.8" stroke-linecap="round" />
      <ellipse cx="18" cy="28" rx="1.6" ry="0.9" fill="#f87171" />

      <!-- Party Hat with Stripes -->
      <g className="doodle-party-hat">
        <!-- Cone Base -->
        <polygon points="12,14 24,14 18,2" fill="#ef4444" />
        <!-- Striped Bands -->
        <polygon points="14,11 22,11 20,8 16,8" fill="#facc15" />
        <polygon points="16,6 20,6 18,3 18,3" fill="#10b981" />
        <polygon points="17.5,3.5 18.5,3.5 18,2" fill="#3b82f6" />
        <!-- Fluffy Pom-Pom on Top -->
        <circle cx="18" cy="1.8" r="2.2" fill="#f59e0b" />
        <circle cx="18" cy="1.8" r="1.2" fill="#fef08a" />
      </g>
    </g>

    <!-- ========================================================
         3. 3D GOLDEN "10"
         ======================================================== -->
    <g className="doodle-gold-ten" filter="url(#goldGlow)" transform="translate(46, 6)">
      <!-- Digit '1' Shadow -->
      <path d="M 5 6 L 12 1 L 18 1 L 18 32 L 8 32 L 8 28 L 12 28 L 12 7 L 6 10 Z" fill="url(#doodleGoldShadow)" transform="translate(0.8, 1)" />
      <!-- Digit '1' Main -->
      <path d="M 5 6 L 12 1 L 18 1 L 18 32 L 8 32 L 8 28 L 12 28 L 12 7 L 6 10 Z" fill="url(#doodleGold)" stroke="#d97706" stroke-width="0.6" stroke-linejoin="round" />
      <!-- Digit '1' Highlight -->
      <path d="M 12 2 L 17 2 L 17 18 L 15 18 L 15 5 L 12 6 Z" fill="url(#doodleHighlight)" opacity="0.65" />

      <!-- Digit '0' Shadow -->
      <path d="M 33 1 C 24 1 20 8 20 17 C 20 26 24 33 33 33 C 42 33 46 26 46 17 C 46 8 42 1 33 1 Z M 33 8 C 37 8 38 12 38 17 C 38 22 37 26 33 26 C 29 26 28 22 28 17 C 28 12 29 8 33 8 Z" fill="url(#doodleGoldShadow)" transform="translate(0.8, 1)" />
      <!-- Digit '0' Main -->
      <path d="M 33 1 C 24 1 20 8 20 17 C 20 26 24 33 33 33 C 42 33 46 26 46 17 C 46 8 42 1 33 1 Z M 33 8 C 37 8 38 12 38 17 C 38 22 37 26 33 26 C 29 26 28 22 28 17 C 28 12 29 8 33 8 Z" fill="url(#doodleGold)" stroke="#d97706" stroke-width="0.6" />
      <!-- Digit '0' Shoulder Highlight -->
      <path d="M 27 6 C 30 3 36 3 39 6 C 41 8 42 11 41 12 C 40 10 38 8 35 7 C 32 6 29 7 28 9 C 27 8 27 7 27 6 Z" fill="url(#doodleHighlight)" opacity="0.75" />
    </g>

    <!-- ========================================================
         4. TINY BOUNCING GIFT BOX
         ======================================================== -->
    <g className="doodle-gift-box" transform="translate(94, 25)">
      <!-- Box Body -->
      <rect x="0" y="4" width="13" height="11" rx="1.8" fill="#ec4899" stroke="#db2777" stroke-width="0.6" />
      <rect x="-0.8" y="2.5" width="14.6" height="3" rx="1" fill="#f43f5e" stroke="#e11d48" stroke-width="0.5" />
      <!-- Gold Vertical Ribbon -->
      <rect x="5" y="2.5" width="3" height="12.5" fill="#f59e0b" />
      <!-- Gold Ribbon Bow Loops -->
      <ellipse cx="4.5" cy="1.6" rx="2.5" ry="1.6" fill="#fde047" stroke="#d97706" stroke-width="0.5" />
      <ellipse cx="8.5" cy="1.6" rx="2.5" ry="1.6" fill="#fde047" stroke="#d97706" stroke-width="0.5" />
      <circle cx="6.5" cy="2" r="1.2" fill="#f59e0b" />
    </g>

    <!-- ========================================================
         5. TYPOGRAPHY: "Years of" + "OxyLoans"
         ======================================================== -->
    <g className="doodle-text-group" transform="translate(112, 0)">
      <!-- Line 1: "Years of" in Royal OxyLoans Blue -->
      <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12.5" font-weight="800" fill="#1d4ed8" letter-spacing="-0.01em">
        Years of
      </text>

      <!-- Line 2: "OxyLoans" in Signature Emerald Green -->
      <text x="0" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="17" font-weight="900" fill="#059669" letter-spacing="-0.02em">
        OxyLoans
      </text>

      <!-- Celebratory Swoosh / Streamer Underneath -->
      <path d="M 0 41 Q 38 43 78 41 Q 50 44 0 41 Z" fill="#f59e0b" opacity="0.85" />
    </g>

    <!-- ========================================================
         6. CELEBRATION SPARKLES (✦)
         ======================================================== -->
    <!-- Sparkle 1: Above character hat -->
    <g className="doodle-sparkle-star sparkle-anim-1" transform="translate(24, 2)">
      <polygon points="0,-3.5 1,-1 3.5,0 1,1 0,3.5 -1,1 -3.5,0 -1,-1" fill="#f59e0b" />
    </g>

    <!-- Sparkle 2: Above Golden 10 -->
    <g className="doodle-sparkle-star sparkle-anim-2" transform="translate(78, 4)">
      <polygon points="0,-4 1.2,-1.2 4,0 1.2,1.2 0,4 -1.2,1.2 -4,0 -1.2,-1.2" fill="#fbbf24" />
    </g>

    <!-- Sparkle 3: Beside OxyLoans text -->
    <g className="doodle-sparkle-star sparkle-anim-3" transform="translate(196, 18)">
      <polygon points="0,-3.5 1,-1 3.5,0 1,1 0,3.5 -1,1 -3.5,0 -1,-1" fill="#10b981" />
    </g>
  </g>
</svg>
